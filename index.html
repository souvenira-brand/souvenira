<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="public/Souvenira.jpeg" type="image/jpeg"></head><body><title>Souvenira Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style id="wt-style">:root{
  --petal:#FDF5F6;--paper:#FFFFFF;--blush:#F4D3D9;--blush-2:#FAE8EB;--blush-3:#FCEFF1;
  --rose:#A85468;--rose-2:#C27A8B;--rose-soft:#E8B4BE;--ink:#3B3437;--muted:#83737A;--line:#F0DCE1;
  --gold:#B8924F;--ok:#3E7D5A;--warn:#9A5B1E;--danger:#A43D4E;
  --shadow:0 1px 2px rgba(120,60,75,.06),0 8px 24px -12px rgba(120,60,75,.22);
  --shadow-lg:0 20px 60px -20px rgba(90,40,55,.35);
  --r:18px;--r-sm:12px;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Jost","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--petal);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(253,245,246,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.lined{border-bottom-color:var(--line)}
.bar-in{display:grid;grid-template-columns:44px 1fr auto;align-items:center;height:58px;max-width:1120px;margin:0 auto;padding-inline:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.icon-btn:hover{background:var(--blush-2)}
.icon-btn svg{width:22px;height:22px}
.bar-brand{justify-self:center;border:0;background:none;font:italic 500 23px/1 var(--display);letter-spacing:.01em;color:var(--ink);padding:6px 10px}
.badge{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font:600 11px/19px var(--sans);text-align:center}
.bar-right{display:flex;align-items:center;gap:2px}
.lang-btn{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 12px/1 var(--sans);letter-spacing:.06em;padding:0 12px;height:34px;border-radius:20px;display:inline-flex;align-items:center}
.lang-btn:hover{background:var(--blush-2)}

/* home */
.hero{text-align:center;padding-block:44px 30px}
.hero .mark{font:italic 500 clamp(46px,12vw,76px)/.95 var(--display);color:var(--ink);letter-spacing:-.005em}
.hero .logo{width:clamp(180px,48vw,260px);aspect-ratio:1;margin:0 auto;border-radius:50%;object-fit:cover;box-shadow:var(--shadow)}
.hero .tag{margin-top:14px;font:500 12px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--rose)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px auto 0;color:var(--gold)}
.orn i{display:block;width:56px;height:1px;background:currentColor;opacity:.55}
.orn svg{width:16px;height:16px}
.hero p{max-width:34ch;margin:16px auto 0;color:var(--muted);font-size:15px}
.label{font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.cats{display:grid;gap:16px;grid-template-columns:1fr;margin-top:14px;padding-bottom:40px}
.cats.multi{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.cats.single{max-width:560px;margin-inline:auto}
.cat{display:block;border:0;padding:0;text-align:left;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cat-img{aspect-ratio:16/11;background:var(--blush-2);overflow:hidden}
.cat-img img{width:100%;height:100%;object-fit:cover}
.cat-body{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 18px}
.cat-name{font:500 26px/1.1 var(--display);color:var(--ink)}
.cat-count{font-size:13px;color:var(--muted);margin-top:4px}
.go{width:40px;height:40px;flex:none;border-radius:50%;background:var(--blush-2);color:var(--rose);display:grid;place-items:center}
.go svg{width:18px;height:18px}

/* category */
.sect-head{padding-block:26px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-head h1{font:500 clamp(32px,8vw,44px)/1.05 var(--display)}
.sect-head .label{margin-bottom:10px;display:block}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:9px 16px;font:500 13px/1 var(--sans);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.cat-tabs button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.cat-tabs button:hover:not(.on){background:var(--blush-2)}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 0 30px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:110px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}}
@media (min-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-img{aspect-ratio:4/5;background:#fff;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.07)}
.in-sel{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--rose);font:600 11px/1 var(--sans);padding:6px 9px;border-radius:20px;letter-spacing:.04em}
.card-body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-name{font:500 14.5px/1.3 var(--sans);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.code{font:500 11px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.price{font:600 15px/1.3 var(--sans);color:var(--rose);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty h2{font:500 30px/1.1 var(--display);color:var(--ink);margin-bottom:8px}

/* product */
.pd{display:grid;gap:22px;padding-block:14px 120px}
@media (min-width:860px){.pd{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;padding-top:28px;align-items:start}}
.gal{position:relative}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);background:#fff;scrollbar-width:none;box-shadow:var(--shadow)}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:contain;scroll-snap-align:center}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(168,84,104,.2)}
.dots i.on{background:var(--rose);width:18px;border-radius:4px}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:64px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--blush-2)}
.thumbs button.on{border-color:var(--rose)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd-info{display:flex;flex-direction:column;gap:14px}
@media (min-width:860px){.pd-info{position:sticky;top:90px}}
.chip{align-self:flex-start;font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--rose);background:var(--blush-2);padding:8px 11px;border-radius:20px}
.pd-name{font:500 clamp(30px,7vw,42px)/1.08 var(--display)}
.pd-price{font:600 22px/1 var(--sans);color:var(--rose);font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stepper{display:inline-flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:3px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:20px;line-height:1;color:var(--rose)}
.stepper button:hover{background:var(--blush-2)}
.stepper button:disabled{color:#d8c4c9;background:none;cursor:default}
.stepper output{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.sm button{width:32px;height:32px;font-size:17px}
.stepper.sm output{min-width:26px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:30px;border:0;background:var(--rose);color:#fff;font:500 15px/1 var(--sans);letter-spacing:.04em;text-decoration:none;transition:background .2s,transform .1s}
.btn:hover{background:#94475A}
.btn:active{transform:scale(.99)}
.btn svg{width:20px;height:20px}
.btn.block{width:100%}
.btn.ghost{background:var(--paper);color:var(--rose);box-shadow:inset 0 0 0 1px var(--rose-soft)}
.btn.ghost:hover{background:var(--blush-3)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}

/* selection */
.sel{padding-bottom:60px;max-width:720px;margin:0 auto}
.sel-list{display:flex;flex-direction:column;gap:12px}
.sel-item{display:grid;grid-template-columns:78px 1fr;gap:14px;background:var(--paper);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.sel-item .ph{width:78px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--blush-2);border:0;padding:0}
.sel-item .ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.sel-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sel-name{font-weight:500;line-height:1.3}
.sel-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.link-btn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.link-btn:hover{color:var(--danger)}
.summary{margin-top:18px;background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum-row b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.btn.wa{background:#1F8F55}
.btn.wa:hover{background:#18784A}

/* floating selection pill */
.float{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.float button{pointer-events:auto;display:flex;align-items:center;gap:12px;border:0;background:var(--ink);color:#fff;border-radius:40px;padding:10px 10px 10px 20px;box-shadow:var(--shadow-lg);font:500 14px/1 var(--sans);width:min(100%,420px);justify-content:space-between}
.float button span.c{background:var(--rose-soft);color:var(--ink);border-radius:30px;padding:10px 14px;font-weight:600}

.foot{text-align:center;padding:26px 16px 40px;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.foot .brandline{font:italic 500 20px/1 var(--display);color:var(--ink);margin-bottom:6px;letter-spacing:0}
.socials{display:flex;justify-content:center;gap:12px;margin-top:18px}
.soc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--rose);box-shadow:var(--shadow);transition:background .2s,color .2s}
.soc:hover{background:var(--rose);color:#fff}
.soc svg{width:20px;height:20px}
.foot .copy{margin-top:14px;font-size:11.5px}
.owner-btn{margin-top:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--rose-soft);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* manage */
.mg{padding-block:22px 120px;max-width:900px;margin:0 auto}
.mg h1{font:500 36px/1.1 var(--display)}
.pubbar{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:12;margin:16px 0;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pubbar .st{flex:1;min-width:180px;font-size:14px}
.pubbar .st b{display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ok)}
.dot.pending{background:#D08A2E}
.meter{height:4px;border-radius:3px;background:var(--blush-2);overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--rose-2)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--rose);border-bottom-color:var(--rose)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools select{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--paper);padding:0 14px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:var(--r-sm);padding:10px;box-shadow:var(--shadow)}
.row .ph{width:56px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--blush-2)}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .meta{min-width:0}
.row .t{font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted)}
.row .acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:20px;min-height:34px;padding:0 12px;font-size:13px;color:var(--ink)}
.mini:hover{background:var(--blush-3)}
.mini.icon{width:34px;padding:0;display:grid;place-items:center}
.mini.icon svg{width:16px;height:16px}
.mini.red{color:var(--danger);border-color:#EBC3CA}
.mini.fill{background:var(--danger);color:#fff;border-color:var(--danger)}
.sample{font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);background:#FBEEDD;border-radius:10px;padding:3px 6px;margin-left:6px;vertical-align:2px}
@media (max-width:560px){.row{grid-template-columns:48px 1fr}.row .ph{width:48px}.row .acts{grid-column:1/-1;justify-content:flex-start}}

.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:500;color:var(--ink)}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid #E7CDD3;background:var(--paper);padding:10px 14px;font-size:16px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rose-soft);border-color:var(--rose-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px}
.warnbox{background:#FFF6EA;border:1px solid #F2DDBF;color:#6E4A1E;border-radius:12px;padding:12px 14px;font-size:13.5px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph-tile{position:relative;border-radius:12px;overflow:hidden;background:var(--blush-2);aspect-ratio:4/5}
.ph-tile img{width:100%;height:100%;object-fit:cover}
.ph-tile .main{position:absolute;top:6px;left:6px;background:var(--rose);color:#fff;font:600 10px/1 var(--sans);padding:4px 7px;border-radius:10px;letter-spacing:.06em}
.ph-tile .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(40,20,28,.55))}
.ph-tile .ctl button{white-space:nowrap;border:0;background:rgba(255,255,255,.92);border-radius:14px;font-size:11px;padding:5px 8px;color:var(--ink)}
.add-tile{border:1.5px dashed var(--rose-soft);background:var(--blush-3);color:var(--rose);border-radius:12px;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer;text-align:center;padding:6px}
.add-tile svg{width:22px;height:22px}
.add-tile input{position:absolute;width:1px;height:1px;opacity:0}
.cat-img-edit{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start}
.cat-img-edit .ph-tile{aspect-ratio:16/11}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.qr img{width:150px;height:150px;image-rendering:pixelated;border-radius:8px}

/* modal sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(59,52,55,.42);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--petal);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
@media (min-width:720px){.sheet{border-radius:22px;padding:26px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-head h2{font:500 28px/1.1 var(--display)}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.busy{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ring{0%{transform:scale(.94);opacity:.6}100%{transform:scale(1.28);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(45deg)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero{position:relative;overflow:hidden}
.logo-wrap{position:relative;display:block;width:fit-content;margin:0 auto;animation:float 6s ease-in-out infinite}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--rose-soft);animation:ring 3.6s ease-out infinite;pointer-events:none}
.logo-wrap::after{animation-delay:1.8s}
.orn svg{animation:beat 2.6s ease-in-out infinite}
.spark{position:absolute;color:var(--gold);animation:twinkle 3.4s ease-in-out infinite;pointer-events:none}
.spark svg{width:100%;height:100%;display:block}
.enter .hero>:not(.spark){animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.enter .hero>:nth-child(2){animation-delay:.12s}
.enter .hero>:nth-child(3){animation-delay:.22s}
.enter .hero>:nth-child(4){animation-delay:.32s}
.enter .car{animation:rise .9s cubic-bezier(.2,.7,.2,1) .4s both}
.enter .sect-head,.enter .pd>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.enter .pd>:nth-child(2){animation-delay:.12s}
.pre{opacity:0}
.pre.in{animation:rise .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms) both}
.card-img::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-120%) skewX(-20deg);pointer-events:none}
.card:hover .card-img::after{animation:shine .9s ease}
.card:active{transform:scale(.98)}
.badge.bump{animation:bump .5s ease}
#browse{scroll-margin-top:70px}

/* featured carousel */
.car{position:relative;margin:4px 0 34px;border-radius:calc(var(--r) + 6px);overflow:hidden;box-shadow:var(--shadow-lg)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;grid-template-columns:1fr;align-items:center;gap:10px;padding:26px 22px 58px;background:radial-gradient(circle at 75% 35%,#fff 0,var(--blush-3) 45%,var(--blush) 100%);position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;border:1px solid rgba(184,146,79,.28);right:-140px;top:-160px;pointer-events:none}
.slide::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid rgba(184,146,79,.2);left:-90px;bottom:-130px;pointer-events:none}
@media (min-width:720px){.slide{grid-template-columns:1fr 1.15fr;padding:40px 70px 58px;gap:24px}}
.slide-text{display:flex;flex-direction:column;gap:12px;align-items:flex-start;order:2;position:relative;z-index:2}
@media (min-width:720px){.slide-text{order:0}}
.slide-text h2{font:500 clamp(34px,7vw,52px)/1.02 var(--display);color:var(--ink)}
.slide-meta{color:var(--muted);font-size:14px}
@keyframes newpulse{0%,100%{box-shadow:0 0 0 0 rgba(168,84,104,.45)}60%{box-shadow:0 0 0 9px rgba(168,84,104,0)}}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.new-tag{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--rose),var(--gold));padding:8px 12px;border-radius:20px;animation:newpulse 2s ease-out infinite}
.new-tag svg{width:11px;height:11px;animation:twinkle 2.4s ease-in-out infinite}
.new-tag::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s ease-in-out infinite}
.slide-meta b{color:var(--rose);font-weight:600}
.slide .btn svg{width:18px;height:18px;transition:transform .25s}
.slide .btn:hover svg{transform:translateX(4px)}
[dir=rtl] .slide .btn svg{transform:scaleX(-1)}
[dir=rtl] .slide .btn:hover svg{transform:scaleX(-1) translateX(4px)}
.slide-text>*{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.slide.on .slide-text>*{opacity:1;transform:none}
.slide.on .slide-text>:nth-child(2){transition-delay:.1s}
.slide.on .slide-text>:nth-child(3){transition-delay:.2s}
.slide.on .slide-text>:nth-child(4){transition-delay:.3s}
.slide-art{position:relative;height:260px;z-index:1}
@media (min-width:720px){.slide-art{height:340px}}
.slide-art button{position:absolute;top:50%;left:50%;width:min(46%,230px);aspect-ratio:4/5;border:0;padding:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow-lg);transform:translate(-50%,-50%) scale(.82);opacity:0;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .6s ease}
.slide-art img{width:100%;height:100%;object-fit:contain}
.slide-art .f0{z-index:3}
.slide-art .f1{z-index:2}
.slide-art .f2{z-index:1}
.slide.on .slide-art button{opacity:1}
.slide.on .slide-art .f0{transform:translate(-50%,-52%)}
.slide.on .slide-art .f1{transform:translate(-112%,-46%) rotate(-9deg) scale(.86);transition-delay:.15s}
.slide.on .slide-art .f2{transform:translate(12%,-46%) rotate(9deg) scale(.86);transition-delay:.25s}
.slide.on .slide-art .f0 img{animation:kenburns 6s ease-out both}
.slide.on .slide-art .f0:hover{transform:translate(-50%,-56%) scale(1.03)}
.car-nav{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--rose);box-shadow:var(--shadow);display:grid;place-items:center;z-index:4;transition:transform .2s,background .2s}
.car-nav:hover{background:#fff;transform:scale(1.1)}
.car-nav svg{width:20px;height:20px}
.car-nav.prev{left:12px}
.car-nav.next{right:12px}
.car-nav.next svg{transform:scaleX(-1)}
@media (max-width:719px){.car-nav{display:none}}
.car-dots{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:7px;z-index:4}
.car-dots button{width:8px;height:8px;border-radius:5px;border:0;padding:0;background:rgba(168,84,104,.25);transition:width .35s,background .35s}
.car-dots button.on{width:26px;background:var(--rose)}
.car-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(168,84,104,.08);z-index:4}
.car-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose-soft),var(--rose));transform-origin:left;transform:scaleX(0)}
.car-bar i.run{animation:progress 5s linear forwards}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:reduce){.slide-text>*,.slide-art button{opacity:1!important}.slide-art .f0{transform:translate(-50%,-52%)!important}.slide-art .f1{transform:translate(-112%,-46%) rotate(-9deg) scale(.86)!important}.slide-art .f2{transform:translate(12%,-46%) rotate(9deg) scale(.86)!important}}
</style>

      case 'cimgrm': modal.e.image = ''; renderModal(); break;
      case 'saveprod': {
        var e = modal.e; e.name = String(e.name || '').trim(); e.code = String(e.code || '').trim();
        var price = parseFloat(e.price);
        if (!e.name) modal.err = 'Add a product name.';
        else if (!e.code) modal.err = 'Add a product code.';
        else if (isNaN(price) || price < 0) modal.err = 'Add a price, for example 450.';
        else if (!e.categoryId) modal.err = 'Choose a category.';
        else if (D().products.some(function (p) { return p.code.toLowerCase() === e.code.toLowerCase() && p.id !== modal.id; })) modal.err = 'Another product already uses code ' + e.code + '. Choose a different code.';
        else modal.err = '';
        if (modal.err) { renderModal(); break; }
        e.price = price; startDraft();
        if (modal.id) { var orig = prod(modal.id); if (JSON.stringify(orig) !== JSON.stringify(e)) e.sample = false; draft.products = draft.products.map(function (p) { return p.id === modal.id ? e : p; }); }
        else { e.id = uid('p'); e.sample = false; draft.products.push(e); }
        var wasNew = !modal.id; modal = null; renderModal(); changed(); toast(wasNew ? 'Product added. Publish to make it live.' : 'Product saved. Publish to make it live.'); break;
      }
      case 'savecat': {
        var c = modal.e; c.name = String(c.name || '').trim();
        if (!c.name) { modal.err = 'Add a category name.'; renderModal(); break; }
        startDraft();
        if (modal.id) draft.categories = draft.categories.map(function (x) { return x.id === modal.id ? c : x; });
        else { c.id = slug(c.name); draft.categories.push(c); }
        modal = null; renderModal(); changed(); toast('Category saved. Publish to make it live.'); break;
      }
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-f') && modal) { modal.e[t.getAttribute('data-f')] = t.value; return; }
    if (t.hasAttribute('data-set')) {
      startDraft(); draft.settings[t.getAttribute('data-set')] = t.value; persistDraft();
      clearTimeout(t._rt); t._rt = setTimeout(function () { var pb = document.querySelector('.pubbar'); if (pb && !pb.querySelector('.pending')) { var fid = t.id, pos = t.selectionStart; render(); var n = document.getElementById(fid); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } } else if (t.id === 'set-link') drawQR(); }, 400);
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'mg-filter') { mgFilter = t.value; render(); return; }
    if (t.hasAttribute('data-f') && modal) { modal.e[t.getAttribute('data-f')] = t.value; return; }
    if ((t.id === 'ph-input' || t.id === 'cimg-input') && modal && t.files && t.files.length) {
      var files = Array.prototype.slice.call(t.files); modal.loading = true; renderModal();
      files.reduce(function (pr, f) {
        return pr.then(function () { return readImage(f).then(function (u) { if (!modal) return; if (t.id === 'ph-input') modal.e.photos.push(u); else modal.e.image = u; }, function () { if (modal) modal.err = 'One file could not be read as an image.'; }); });
      }, Promise.resolve()).then(function () { if (modal) { modal.loading = false; renderModal(); } });
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && modal) { modal = null; renderModal(); } });

  /* ---------- boot ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function capability(name) {
    for (var i = 0; i < 50 && !(window.claude && window.claude.use); i++) await sleep(200);
    if (!(window.claude && window.claude.use)) return null;
    try { return await window.claude.use(name); } catch (e) { return null; }
  }
  render(true);
  try { if (sessionStorage.getItem('wt-just-published')) { sessionStorage.removeItem('wt-just-published'); setTimeout(function () { toast('Published. Customers now see the latest catalog.'); }, 300); } } catch (e) {}
  (async function () {
    var user = await capability('user');
    var owner = false;
    try { owner = !!(user && (await user.canEdit())); } catch (e) { owner = false; }
    if (!owner) return;
    isOwner = true;
    artifactCap = await capability('artifact');
    try { var saved = JSON.parse(sget('wt-draft') || 'null'); if (saved && saved.base === BASE_SIG && saved.data) draft = saved.data; else sdel('wt-draft'); } catch (e) {}
    render();
  })();
})();
</script>
</body></html>
